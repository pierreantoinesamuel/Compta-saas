services:
  - type: web
    name: haxatax
    env: node
    plan: free
    buildCommand: npm install && npx vite build
    startCommand: npx tsx server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
